
<!DOCTYPE html>
<html>
<head>
    <title>Cloud Waste Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cloud-Based Waste Management System</h1>
        <p>Smart Waste Collection and Monitoring</p>
    </header>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#add">Add Waste</a>
        <a href="#records">Waste Records</a>
    </nav>

    <section id="dashboard">
        <h2>Dashboard</h2>

        <div class="cards">
            <div class="card">
                <h3>Total Records</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Collected</h3>
                <p id="collected">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pending">0</p>
            </div>
        </div>
    </section>

    <section id="add">
        <h2>Add Waste Collection</h2>

        <form id="wasteForm">
            <label>Location:</label>
            <input type="text" id="location"
                   placeholder="Enter location" required>

            <label>Waste Type:</label>
            <select id="type" required>
                <option value="">Select waste type</option>
                <option>Plastic</option>
                <option>Paper</option>
                <option>Food Waste</option>
                <option>Electronic Waste</option>
                <option>General Waste</option>
            </select>

            <label>Waste Quantity (kg):</label>
            <input type="number" id="quantity"
                   min="0.1" step="0.1" required>

            <label>Collection Status:</label>
            <select id="status">
                <option>Pending</option>
                <option>Collected</option>
            </select>

            <button type="submit">Add Record</button>
        </form>
    </section>

    <section id="records">
        <h2>Waste Collection Records</h2>

        <input type="text" id="search"
               placeholder="Search by location or waste type">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>Waste Type</th>
                        <th>Quantity (kg)</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="wasteTable"></tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>Cloud-Based Waste Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
